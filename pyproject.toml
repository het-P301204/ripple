[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-scanner"
version = "1.0.0"
description = "RIPPLE — Software Supply Chain Attack Surface Scanner (read-only, defensive)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27.2",
  "pydantic>=2.6",
  # Security floors: starlette 0.49.1 fixes the FileResponse Range-header DoS and multipart parsing DoS,
  # python-multipart 0.0.18 fixes a multipart boundary ReDoS, h11 0.16 fixes chunked-encoding request smuggling.
  "fastapi>=0.115.6",
  "starlette>=0.49.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "h11>=0.16",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ripple = "ripple.cli.app:main"

[tool.setuptools.packages.find]
include = ["ripple*"]

[tool.setuptools.package-data]
ripple = ["server/static/**/*", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
